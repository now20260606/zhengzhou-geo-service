<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站维护中 — GEO家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      text-align: center; background: white;
      padding: 48px 40px; border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      max-width: 420px; width: 90%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #333; margin-bottom: 12px; }
    p { font-size: 14px; color: #888; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>网站备案中</h1>
    <p>GEO家正在进行ICP备案，<br>期间网站暂停访问。</p>
    <p style="margin-top:16px;font-size:12px;color:#bbb;">备案完成后将恢复服务，感谢您的理解。</p>
  </div>
</body>
</html>
